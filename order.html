<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Start a project — Gray Matter AI</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="assets/logo.png" type="image/png">
  <script>try{var t=localStorage.getItem("gm-theme");document.documentElement.dataset.theme=t||(matchMedia("(prefers-color-scheme: light)").matches?"light":"dark")}catch(e){document.documentElement.dataset.theme="dark"}document.documentElement.classList.add("js")</script>
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/sections.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="nav compact"><div class="container nav-grid" style="grid-template-columns:1fr auto">
    <a class="brand chip" href="index.html" aria-label="Gray Matter AI, home"><img src="assets/logo.png" width="32" height="32" alt=""><span>Gray Matter AI</span></a>
    <div class="nav-end">
      <button class="icon-btn theme-btn" id="theme-btn" type="button" aria-label="Switch to light theme"><svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg><svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <a class="btn" href="index.html#calculator" style="background:var(--nav-bg);color:var(--nav-fg);box-shadow:0 0 0 1px var(--nav-rule);--btn-fill:var(--nav-fg);--btn-fill-fg:var(--nav-bg)">Back to the calculator</a>
    </div>
  </div></header>
  <main id="main" class="order surface-ink">
    <div class="container">
      <p class="mark micro"><b>(09)</b> Start a project</p>
      <h1 class="h1" style="max-inline-size:14ch">Tell us what you need.</h1>
      <p class="prose" style="margin-block-start:24px">We'll reply with a scope and a price. <span id="prefill"></span></p>
      <!-- TODO(client): this is a front-end stub. Point `action` at the real form handler or order backend. -->
      <form id="order-form" method="post" action="#" novalidate>
        <label>Your name <input name="name" autocomplete="name" required></label>
        <label>Email <input name="email" type="email" autocomplete="email" required></label>
        <label>Phone or WhatsApp <span class="hint">Optional</span> <input name="phone" type="tel" autocomplete="tel"></label>
        <label>What do you want to build? <textarea name="brief" required></textarea></label>
        <input type="hidden" name="estimate"><input type="hidden" name="type"><input type="hidden" name="scope"><input type="hidden" name="addons"><input type="hidden" name="ref">
        <div><button class="btn" type="submit">Send the brief <span class="arr" aria-hidden="true">→</span></button></div>
        <p id="msg" role="status" class="hint"></p>
      </form>
    </div>
  </main>
  <script src="js/ui.js"></script>
  <script>
    (function () {
      var q = new URLSearchParams(location.search), f = document.getElementById("order-form");
      ["estimate", "type", "scope", "addons", "ref"].forEach(function (k) { if (q.get(k) && f.elements[k]) f.elements[k].value = q.get(k); });
      if (q.get("estimate")) document.getElementById("prefill").textContent = "Your calculator estimate of about " + Number(q.get("estimate")).toLocaleString("en-US") + " JOD is attached.";
      f.addEventListener("submit", function (e) {
        e.preventDefault();
        var m = document.getElementById("msg"), bad = [].slice.call(f.querySelectorAll("[required]")).filter(function (i) { return !i.value.trim(); })[0];
        if (bad) { m.textContent = "Add your " + (bad.name === "brief" ? "brief" : bad.name) + " so we can reply."; bad.focus(); return; }
        m.textContent = "TODO(client): connect this form to a backend. Nothing was sent.";
      });
    })();
  </script>
</body>
</html>
